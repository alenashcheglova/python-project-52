name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-scan:
    name: Build, Test and Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Run tests and collect coverage
        run: |
          make test-coverage
          sed -i 's|<source>.*</source>|<source>/github/workspace</source>|g' coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/manage.py,**/migrations/**,**/.venv/**,**/*.html,task_manager/settings.py,task_manager/asgi.py,task_manager/wsgi.py,**/tests.py,**/admin.py,**/apps.py
            -Dsonar.coverage.exclusions=**/manage.py,**/migrations/**,**/.venv/**,**/*.html,task_manager/settings.py,task_manager/asgi.py,task_manager/wsgi.py,**/tests.py,**/admin.py,**/apps.py