name: hexlet-check

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hexlet project check
        uses: hexlet/project-action@850029b3504a5009f53e6b7c2cc0ba5e09f5e135
        with:
          hexlet-id: ${{ secrets.HEXLET_ID }}
