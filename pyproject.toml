[project]
name = "hexlet-code"
version = "0.1.0"
description = "task_manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "django-bootstrap5>=26.2",
    "django-filter>=26.1",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sentry-sdk>=2.68.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
exclude = [
    "*/migrations/*",
    "task_manager/settings.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
relative_files = true
omit = [
    "manage.py",
    "task_manager/settings.py",
    "task_manager/wsgi.py",
    "task_manager/asgi.py",
    "*/migrations/*",
    "*/tests.py",
    "*/admin.py",
    "*/apps.py"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "task_manager.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]